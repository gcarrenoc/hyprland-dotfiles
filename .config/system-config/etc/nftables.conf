#!/usr/bin/nft -f
# Firewall: nothing from the network gets in unless this laptop started it.
# Installed copy: /etc/nftables.conf (nftables.service). Tracked in the dotfiles.
# The table is destroyed and rebuilt, so other programs' tables are left alone.

destroy table inet filter
table inet filter {
  chain input {
    type filter hook input priority filter
    policy drop

    ct state invalid drop comment "early drop of invalid connections"
    ct state {established, related} accept comment "replies to what this laptop started"
    iif lo accept comment "this computer itself"
    meta l4proto { icmp, icmpv6 } accept comment "ping, IPv6 neighbours"
    udp sport 547 udp dport 546 ip6 saddr fe80::/10 accept comment "DHCPv6 replies"
    udp dport 5353 ip daddr 224.0.0.251 accept comment "mDNS: find printers, TVs (Cast)"
    udp dport 5353 ip6 daddr ff02::fb accept comment "mDNS over IPv6"
    # Sharing this laptop's connection (hotspot)? Its clients need these two:
    # udp dport { 53, 67 } accept
    # tcp dport 53 accept
    counter comment "everything else is dropped"
  }
  chain forward {
    type filter hook forward priority filter
    policy drop
  }
}
