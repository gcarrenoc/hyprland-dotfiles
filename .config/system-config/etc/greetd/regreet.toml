# ReGreet — graphical login screen (themed to match Hyprland)

[background]
path = "/usr/share/backgrounds/regreet/wallpaper.jpg"
fit = "Cover"

[GTK]
application_prefer_dark_theme = true
theme_name = "Adwaita"
icon_theme_name = "Papirus-Dark"
cursor_theme_name = "Adwaita"
font_name = "Fira Sans 12"

[commands]
reboot = [ "systemctl", "reboot" ]
poweroff = [ "systemctl", "poweroff" ]

[appearance]
greeting_msg = "Welcome back"

[widget.clock]
format = "%A %d %B  ·  %H:%M"
