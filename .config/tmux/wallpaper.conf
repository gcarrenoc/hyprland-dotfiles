# Generated by ~/.config/hypr/scripts/terminal-colors from jellyfish.jpg — do not edit

# Accent: wallpaper blue normally, yellow while the prefix is pressed, magenta in copy mode
set -g @accent "#{?client_prefix,#f3eb91,#{?pane_in_mode,#db91f3,#92c2f6}}"
set -g status-style "bg=default,fg=#c1cbd7"
set -g status-left "#[fg=#{E:@accent},bg=default]#[fg=#051221,bg=#{E:@accent},bold] #S#[fg=#{E:@accent},bg=default,nobold] "
setw -g window-status-format " #[fg=#426994]#I #[fg=#c1cbd7]#W#{?window_zoomed_flag,#[fg=#68e4f3] 󰍉,}#{?window_activity_flag,#[fg=#e5db6c] ,} "
setw -g window-status-current-format "#[fg=#12365e,bg=default]#[fg=#92c2f6,bg=#12365e,bold]#I #[fg=#eff2f6,nobold]#W#{?window_zoomed_flag,#[fg=#68e4f3] 󰍉,}#[fg=#12365e,bg=default]"
setw -g window-status-bell-style "fg=#e56c87"
set -g status-right "#($HOME/.local/bin/caffeinate tmux)#[fg=#c1cbd7] #{=/-40/…:#{s|^#{HOME}|~|:pane_current_path}}  #[fg=#426994]│  #[fg=#92c2f6] #[fg=#eff2f6]%H:%M "
set -g pane-border-style "fg=#12365e"
set -g pane-active-border-style "fg=#92c2f6"
set -g display-panes-colour "#426994"
set -g display-panes-active-colour "#92c2f6"
set -g pane-colours[0] "#0f253d"
set -g pane-colours[1] "#e56c87"
set -g pane-colours[2] "#6ce59d"
set -g pane-colours[3] "#e5db6c"
set -g pane-colours[4] "#5fa5f2"
set -g pane-colours[5] "#c76ce5"
set -g pane-colours[6] "#68e4f3"
set -g pane-colours[7] "#c1cbd7"
set -g pane-colours[8] "#426994"
set -g pane-colours[9] "#f391a7"
set -g pane-colours[10] "#91f3b8"
set -g pane-colours[11] "#f3eb91"
set -g pane-colours[12] "#92c2f6"
set -g pane-colours[13] "#db91f3"
set -g pane-colours[14] "#97ecf7"
set -g pane-colours[15] "#eff2f6"

set -g window-style "fg=#d5e0ec,dim=13"
set -g message-style "bg=#051221,fg=#d5e0ec,fill=#051221,width=100%"
set -g message-command-style "bg=#051221,fg=#92c2f6,fill=#051221,width=100%"
set -g prompt-cursor-colour "#92c2f6"
setw -g mode-style "bg=#12365e,fg=#eff2f6"
setw -g copy-mode-match-style "bg=#c76ce5,fg=#051221"
setw -g copy-mode-current-match-style "bg=#f3eb91,fg=#051221,bold"
setw -g clock-mode-colour "#92c2f6"
set -g popup-border-style "fg=#426994"
set -g menu-border-style "fg=#426994"
set -g menu-selected-style "bg=#92c2f6,fg=#051221"
