# --- General ---------------------------------------------------------------
set -g mouse on                      # click tabs/panes, drag to resize, wheel to scroll
set -g history-limit 50000           # scrollback lines per pane
set -sg escape-time 10               # no lag after Esc (vim etc.)
set -g focus-events on
# New tabs and panes run Fish (Bash stays the login shell). Back to Bash: delete this line.
if-shell '[ -x /usr/bin/fish ]' 'set -g default-shell /usr/bin/fish'
set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty*:RGB"   # true color in Alacritty

# Number tabs (tmux "windows") and panes from 1, renumber on close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Prefix: Ctrl+Space (Ctrl+B still works as a backup) -------------------
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix             # press Ctrl+Space twice to send it to the app
bind C-b send-prefix -2

# --- Shortcuts (no prefix needed) -----------------------------------------
# Alt+1..9: jump to tab N
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Prefix (Ctrl+B) extras: new tabs and splits open in the current directory
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"    # split side by side
bind - split-window -v -c "#{pane_current_path}"    # split top / bottom
bind '"' split-window -v -c "#{pane_current_path}"  # tmux default, kept
bind % split-window -h -c "#{pane_current_path}"    # tmux default, kept
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"
# Rename prompts with friendly labels (pre-filled with the current name).
# No commas inside -p: tmux treats them as separators between several prompts.
bind '$' command-prompt -I "#S" -p "#[fg=#ffd866]#[bold]\uF489 Rename session:#[nobold]#[fg=#fcfcfa]" { rename-session "%%" }
bind , command-prompt -I "#W" -p "#[fg=#ffd866]#[bold]\uF2D0 Rename tab:#[nobold]#[fg=#fcfcfa]" { rename-window "%%" }

# --- Tab names & window title ----------------------------------------------
# Tab name = running program, or the folder name when it's just the shell
setw -g automatic-rename on
setw -g automatic-rename-format "#{?#{m/r:^(bash|fish)$,#{pane_current_command}},#{?#{==:#{pane_current_path},#{HOME}},~,#{b:pane_current_path}},#{pane_current_command}}"
# Alacritty window title follows the active pane
set -g set-titles on
set -g set-titles-string "#{pane_current_command} — #{s|^#{HOME}|~|:pane_current_path}"
# Mark background tabs that print new output
setw -g monitor-activity on
set -g visual-activity off

# --- Monokai Pro theme -------------------------------------------------------
# bg #2d2a2e  surface #403e41  muted #727072  dim #939293  text #fcfcfa
# yellow #ffd866  pink #ff6188  orange #fc9867  cyan #78dce8  purple #ab9df2
# Accent: yellow normally, pink while the prefix (Ctrl+Space) is pressed,
# purple in copy/scroll mode
set -g @accent "#{?client_prefix,#ff6188,#{?pane_in_mode,#ab9df2,#ffd866}}"

set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#2d2a2e,fg=#939293"

# Left: rounded session pill
set -g status-left-length 40
set -g status-left "#[fg=#{E:@accent},bg=#2d2a2e]#[fg=#2d2a2e,bg=#{E:@accent},bold] #S#[fg=#{E:@accent},bg=#2d2a2e,nobold] "

# Tabs: active one gets a rounded highlight; zoom and activity icons
setw -g window-status-separator ""
setw -g window-status-format " #[fg=#727072]#I #[fg=#939293]#W#{?window_zoomed_flag,#[fg=#78dce8] ,}#{?window_activity_flag,#[fg=#fc9867] ,} "
setw -g window-status-current-format "#[fg=#403e41,bg=#2d2a2e]#[fg=#ffd866,bg=#403e41,bold]#I #[fg=#fcfcfa,nobold]#W#{?window_zoomed_flag,#[fg=#78dce8] ,}#[fg=#403e41,bg=#2d2a2e]"
setw -g window-status-current-style "default"   # tmux 3.8 default is underscore
setw -g window-status-activity-style "none"
setw -g window-status-bell-style "fg=#ff6188"

set -g status-right-length 80
# Right: caffeinate indicator (only while active), current folder, time
set -g status-right "#($HOME/.local/bin/caffeinate tmux)#[fg=#939293] #{=/-40/…:#{s|^#{HOME}|~|:pane_current_path}}  #[fg=#727072]│  #[fg=#78dce8] #[fg=#fcfcfa]%H:%M "

# Panes
set -g pane-border-lines single
set -g pane-border-indicators colour
set -g pane-border-style "fg=#403e41"
set -g pane-active-border-style "fg=#ffd866"
set -g display-panes-colour "#727072"
set -g display-panes-active-colour "#ffd866"

# Dim unfocused panes by 13%.
# pane-colours = Alacritty's Monokai Pro palette, so tmux dims the real colours
# (without it, tmux assumes the xterm palette and dimmed colours change hue).
# fg is set so plain text gets dimmed too; the focused pane is left untouched.
set -g pane-colours[0] "#403e41"
set -g pane-colours[1] "#ff6188"
set -g pane-colours[2] "#a9dc76"
set -g pane-colours[3] "#ffd866"
set -g pane-colours[4] "#fc9867"
set -g pane-colours[5] "#ab9df2"
set -g pane-colours[6] "#78dce8"
set -g pane-colours[7] "#fcfcfa"
set -g pane-colours[8] "#727072"
set -g pane-colours[9] "#ff6188"
set -g pane-colours[10] "#a9dc76"
set -g pane-colours[11] "#ffd866"
set -g pane-colours[12] "#fc9867"
set -g pane-colours[13] "#ab9df2"
set -g pane-colours[14] "#78dce8"
set -g pane-colours[15] "#fcfcfa"
set -g window-style "fg=#fcfcfa,dim=13"
set -g window-active-style "default"

# Messages, prompts, copy mode, popups
# width=100%: prompt/messages cover the whole status line (tmux 3.8 draws them
# on top of the bar, only as wide as the text, by default)
set -g message-style "bg=#2d2a2e,fg=#fcfcfa,fill=#2d2a2e,width=100%"
set -g message-command-style "bg=#2d2a2e,fg=#78dce8,fill=#2d2a2e,width=100%"
set -g prompt-cursor-colour "#ffd866"
set -g prompt-cursor-style "bar"
setw -g mode-style "bg=#5b595c,fg=#fcfcfa"
setw -g copy-mode-match-style "bg=#fc9867,fg=#2d2a2e"
setw -g copy-mode-current-match-style "bg=#ffd866,fg=#2d2a2e,bold"
setw -g clock-mode-colour "#ffd866"
set -g popup-border-lines rounded
set -g popup-border-style "fg=#727072"
set -g menu-border-lines rounded
set -g menu-border-style "fg=#727072"
set -g menu-selected-style "bg=#ffd866,fg=#2d2a2e"

# Inside Hyprland: colours generated from the wallpaper (GNOME keeps Monokai Pro above)
if-shell '[ "$XDG_CURRENT_DESKTOP" = Hyprland ] && [ -f ~/.config/tmux/wallpaper.conf ]' 'source-file ~/.config/tmux/wallpaper.conf'
