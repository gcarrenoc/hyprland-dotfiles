<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Prefer Paper Mono (Nerd Font Mono) for the generic "monospace" family (browsers, editors, etc.) -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>PaperMono Nerd Font Mono</family>
    </prefer>
  </alias>
  <!-- No hinting: keeps letter shapes true (fixes Fira Sans' squashed capitals), macOS-like -->
  <match target="font">
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
  </match>
</fontconfig>
