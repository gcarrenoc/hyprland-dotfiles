# rEFInd — menu for Arch + Windows 11, with Brad's rEFInd theme.
# The full commented sample is next to this file: refind.conf.sample
# Fallback: F12 → "Linux Boot Manager" (systemd-boot, still installed) shows the old menu.

timeout 5
use_nvram false
log_level 0
resolution max
enable_mouse

# look: Brad's rEFInd theme (github.com/toptensoftware/brads-refind-theme) — background, selection, icons
include themes/brads-refind-theme/theme.conf
hideui singleuser,hints,arrows,badges

# what is shown: the entries below + USB drives (installers); tools on the second row
scanfor manual,external
showtools reboot,shutdown,firmware
default_selection "Arch Linux"

menuentry "Arch Linux" {
    icon    /EFI/refind/themes/brads-refind-theme/icons/os_arch.png
    loader  /vmlinuz-linux
    initrd  /initramfs-linux.img
    options "cryptdevice=PARTUUID=45e29c54-ec91-43b2-97ad-986cdbed0ed9:root root=/dev/mapper/root zswap.enabled=0 rw rootfstype=ext4 resume=/dev/mapper/root resume_offset=76673024 quiet splash"
    submenuentry "LTS kernel" {
        loader  /vmlinuz-linux-lts
        initrd  /initramfs-linux-lts.img
        # the fallback: exactly as before hibernation was set up
        options "cryptdevice=PARTUUID=45e29c54-ec91-43b2-97ad-986cdbed0ed9:root root=/dev/mapper/root zswap.enabled=0 rw rootfstype=ext4 quiet splash"
    }
    submenuentry "Show boot messages (no splash)" {
        options "cryptdevice=PARTUUID=45e29c54-ec91-43b2-97ad-986cdbed0ed9:root root=/dev/mapper/root zswap.enabled=0 rw rootfstype=ext4 resume=/dev/mapper/root resume_offset=76673024"
    }
}

menuentry "Windows 11" {
    icon    /EFI/refind/themes/brads-refind-theme/icons/os_win11.png
    loader  /EFI/Microsoft/Boot/bootmgfw.efi
}
