# Idle behaviour — same timings as your GNOME settings:
# lock after 5 min, screen off right after, suspend after 15 min.
# Apps that ask to stay awake (videos, caffeinate) block these timers.

general {
    lock_cmd = pidof hyprlock || hyprlock
    # Sleep (lid, suspend): lock with no fade-in. The fade starts from a snapshot of the screen,
    # and the laptop suspends mid-fade, so waking up showed the apps before the lock screen.
    before_sleep_cmd = pidof hyprlock || hyprlock --no-fade-in
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 4.5 min: dim the screen as a warning
listener {
    timeout = 270
    on-timeout = brightnessctl -s set 15%
    on-resume = brightnessctl -r
}

# 5 min: lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min: screen off
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' && brightnessctl -r
}

# 15 min: suspend
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
