# Lock screen — light steel palette over the blurred wallpaper
source = ~/.config/hypr/hyprlock-colors.conf   # colours from the wallpaper (scripts/theme)
$font = PaperMono Nerd Font
$clockfont = PaperMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = smooth, 0.25, 1, 0.5, 1
    animation = fadeIn, 1, 5, smooth
    animation = fadeOut, 1, 5, smooth
    animation = inputFieldDots, 1, 2, smooth
}

background {
    monitor =
    path = ~/.config/hypr/wallpapers/current.jpg
    blur_passes = 3
    blur_size = 6
    brightness = 0.75
}

# Time
label {
    monitor =
    text = $TIME
    color = $lock_clock
    font_size = 110
    font_family = $clockfont Bold
    position = 0, 220
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(00000099)
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $lock_date
    font_size = 22
    font_family = $font
    position = 0, 110
    halign = center
    valign = center
}

# Password
input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    rounding = 19
    inner_color = $lock_box
    outer_color = $lock_ring1 $lock_ring2 45deg
    check_color = $lock_ok1 $lock_ok2 45deg
    fail_color = $lock_fail1 $lock_fail2 45deg
    font_color = $lock_box_text
    font_family = $font
    fade_on_empty = false
    placeholder_text = <span foreground="##7b8d96">  Password…</span>
    fail_text = $PAMFAIL
    dots_spacing = 0.35
    dots_center = true
    position = 0, -40
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(00000088)
}

# User
label {
    monitor =
    text =   $USER
    color = $lock_user
    font_size = 14
    font_family = $font
    position = 0, -110
    halign = center
    valign = center
}
